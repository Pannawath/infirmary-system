<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPK Infirmary</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fd;color:#23365f;font:15px system-ui,sans-serif}.card{max-width:680px;padding:40px}.spinner{width:28px;height:28px;border:3px solid #dce5f5;border-top-color:#4167d9;border-radius:50%;animation:spin 1s linear infinite}h2{font-size:22px}p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;color:#61718e}small{color:#8a98b0}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}</style></head>
<body><main class="card"><div class="spinner"></div><h2 id="title">Starting SPK Infirmary</h2><p id="status">Preparing your local database and application. Please wait...</p><small>Your data stays on this computer. Internet is not required.</small></main>
<script>setTimeout(()=>{if(!window.spkStartupError)document.getElementById('status').textContent='Startup is taking longer than usual. The app is still checking the local backend. Please wait; do not reinstall or delete your data.'},30000);</script></body></html>
