<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ห้องพยาบาล · โรงเรียนสารคามพิทยาคม</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f8fafc;
      color: #1e293b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card {
      text-align: center;
      padding: 32px 40px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
      max-width: 360px;
      width: 90%;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 6px;
      color: #0f172a;
    }
    p {
      color: #64748b;
      font-size: 13px;
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>ห้องพยาบาลสารคามพิทยาคม</h2>
    <p id="status">กำลังเตรียมฐานข้อมูลและเปิดระบบ…</p>
  </div>
  <script>
    async function checkBackend() {
      const start = Date.now();
      while (Date.now() - start < 30000) {
        try {
          const res = await fetch('http://127.0.0.1:3103/api/desktop-health');
          if (res.ok) {
            window.location.replace('http://127.0.0.1:3103');
            return;
          }
        } catch (e) {}
        await new Promise(r => setTimeout(r, 400));
      }
      document.getElementById('status').textContent = 'ไม่สามารถเชื่อมต่อระบบภายในได้ กรุณาปิดแล้วเปิดโปรแกรมใหม่อีกครั้ง';
    }
    checkBackend();
  </script>
</body>
</html>
